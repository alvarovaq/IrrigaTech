<div class="container">
    <mat-spinner diameter="30" *ngIf="loading"></mat-spinner>
    <mat-card class="card" *ngIf="!loading">
        <form [formGroup]="form" (ngSubmit)="authenticate()">
            <h1>Log In</h1>
            <div class="form__input">
                <mat-icon mat-list-icon class="input__icon">person</mat-icon>
                <mat-form-field class="input__field">
                    <mat-label>Usuario</mat-label>
                    <input type="text" matInput autocomplete="off" formControlName="login" tabindex="1">
                    <mat-error *ngIf="form.controls['login'].hasError('required')">El nombre de usuario es <strong>obligatorio</strong></mat-error>
                </mat-form-field>
            </div>
            <div class="form__input">
                <mat-icon mat-list-icon class="input__icon">lock_outline</mat-icon>
                <mat-form-field class="input__field">
                    <mat-label>Contraseña</mat-label>
                    <input type="password" matInput autocomplete="off" formControlName="password" tabindex="2">
                    <mat-error *ngIf="form.controls['password'].hasError('required')">La contraseña es <strong>obligatoria</strong></mat-error>
                </mat-form-field>
            </div>
            <button type="submit" mat-raised-button color="primary" tabindex="3" [disabled]="form.invalid || loading">Iniciar Sesión</button>
        </form>
    </mat-card>
</div>
